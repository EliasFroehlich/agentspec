schema_version: "1.1"
domain: testing
file_type: pytest-configuration
last_validated: "2026-10-17"
source: >
  https://docs.pytest.org/en/stable/reference/reference.html,
  https://docs.pytest.org/en/stable/changelog.html,
  https://pytest-asyncio.readthedocs.io/en/latest/reference/configuration.html,
  https://docs.astral.sh/uv/concepts/projects/dependencies/,
  https://docs.databricks.com/aws/en/release-notes/runtime/17.3lts

# ============================================================
# Version targets
# ============================================================

versions:
  pytest:
    current: "9.1.1"            # 2026-06-19; 9.0 dropped Python 3.9
    minversion: "9.0"           # native TOML, strict, subtests
    databricks_runtime_17_3_lts: "8.3.5"   # preinstalled; use the ini_options form or %pip install pytest>=9
  pytest_asyncio:
    current: "1.4.0"            # 2026-05-26; event_loop fixture removed in 1.0.0
  hypothesis:
    current: "6.170.1"          # 2026-10-16

# ============================================================
# pyproject.toml configuration spec (pytest 9 native table [tool.pytest])
# ============================================================

pytest_config:
  description: "Standard pytest configuration for Python projects"
  table: "[tool.pytest]"        # pytest 9+; [tool.pytest.ini_options] still works but not both at once

  testpaths:
    type: list
    default: ["tests"]
    description: "Directories to search for tests"

  python_files:
    type: list
    default: ["test_*.py", "*_test.py"]
    description: "File patterns for test discovery"

  python_classes:
    type: list
    default: ["Test*"]

  python_functions:
    type: list
    default: ["test_*"]

  addopts:
    type: list                  # real TOML list in [tool.pytest]; a string in ini_options
    default: ["-ra"]
    description: "Default CLI options appended to every pytest invocation"

  strict:
    type: bool
    default: true
    since: "9.0"
    description: >
      Enables strict_config, strict_markers, strict_parametrization_ids and strict_xfail.
      Future strictness options are enabled too, so pair it with a pinned pytest version.
    pytest_8_equivalent: 'addopts = "--strict-markers --strict-config"'

  console_output_style:
    type: string
    default: "progress"
    options: ["progress", "classic", "count"]

  markers:
    type: list
    description: "Custom markers (must be registered when strict markers are on)"
    values:
      - name: "unit"
        description: "Unit tests (fast, isolated)"
      - name: "integration"
        description: "Integration tests (may need external services)"
      - name: "slow"
        description: "Slow tests (> 5 seconds)"
      - name: "spark"
        description: "Tests requiring SparkSession"
      - name: "e2e"
        description: "End-to-end tests"

  filterwarnings:
    type: list
    default:
      - "error"
    description: >
      Turn warnings into errors. Do NOT add a blanket "ignore::DeprecationWarning": it hides
      exactly the deprecations that break upgrades (pytest-asyncio fixtures, pydantic Field
      extra kwargs, datetime.utcnow). Ignore specific third-party modules instead, e.g.
      "ignore::DeprecationWarning:some_vendor_lib.*".

  minversion:
    type: string
    default: "9.0"

  asyncio:                       # pytest-asyncio 1.x options (same table); with strict = true these keys
                                 # fail with "Unknown config option" unless pytest-asyncio is installed
    asyncio_mode: "strict"       # default; "auto" handles every async test/fixture
    asyncio_default_fixture_loop_scope: "function"   # unset = fixture scope (default may change)
    asyncio_default_test_loop_scope: "function"      # unset = function

# ============================================================
# pyproject.toml example (pytest 9)
# ============================================================
#
# [tool.pytest]
# minversion = "9.0"
# testpaths = ["tests"]
# addopts = ["-ra"]
# strict = true
# filterwarnings = ["error"]
# asyncio_default_fixture_loop_scope = "function"
# markers = [
#     "unit: Unit tests (fast, isolated)",
#     "integration: Integration tests (external services)",
#     "slow: Slow tests (> 5 seconds)",
#     "spark: Tests requiring SparkSession",
# ]
#
# pytest 8.x (e.g. Databricks Runtime 17.3 LTS) -- use the INI-compatibility table instead:
# [tool.pytest.ini_options]
# testpaths = ["tests"]
# addopts = "-ra --strict-markers --strict-config"
# markers = ["slow: Slow tests (> 5 seconds)"]

# ============================================================
# conftest.py hierarchy
# ============================================================

conftest_hierarchy:
  description: "Recommended conftest.py placement"
  structure:
    root: "tests/conftest.py -- shared fixtures (spark session), markers, pytest_addoption"
    unit: "tests/unit/conftest.py -- unit-specific fixtures"
    integration: "tests/integration/conftest.py -- DB, API fixtures (no pytest_addoption here)"
    spark: "tests/spark/conftest.py -- Spark data factories"
  rules:
    - "pytest_addoption is only called for initial conftests: define CLI flags in tests/conftest.py"
    - "In Databricks notebooks run pytest with sys.dont_write_bytecode = True and -p no:cacheprovider"

# ============================================================
# Coverage configuration
# ============================================================

coverage_config:
  description: "pytest-cov settings in pyproject.toml"
  section: "[tool.coverage.run]"
  settings:
    source: ["src"]
    omit: ["tests/*", "**/__init__.py"]
    branch: true
  report:
    section: "[tool.coverage.report]"
    show_missing: true
    fail_under: 80
    exclude_lines:
      - "pragma: no cover"
      - "if __name__ == .__main__."
      - "if TYPE_CHECKING:"

# ============================================================
# Plugin recommendations (install into a PEP 735 dependency group)
# ============================================================

recommended_plugins:
  - name: "pytest-cov"
    purpose: "Coverage reporting"
    install: "uv add --group test pytest-cov"
  - name: "pytest-xdist"
    purpose: "Parallel test execution (-n auto)"
    install: "uv add --group test pytest-xdist"
  - name: "pytest-mock"
    purpose: "mocker fixture; patches undone automatically"
    install: "uv add --group test pytest-mock"
  - name: "pytest-asyncio"
    purpose: "Async tests and fixtures (1.x API)"
    install: "uv add --group test pytest-asyncio"
  - name: "hypothesis"
    purpose: "Property-based testing"
    install: "uv add --group test hypothesis"
  - name: "pytest-timeout"
    purpose: "Test timeouts (--timeout=60)"
    install: "uv add --group test pytest-timeout"
  - name: "pytest-randomly"
    purpose: "Randomize test order"
    install: "uv add --group test pytest-randomly"
  - name: "pip fallback"
    purpose: "Projects without uv / Databricks notebooks"
    install: "%pip install pytest-cov  (notebook) or pip install pytest-cov"
