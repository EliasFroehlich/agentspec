schema_version: "1.1"
domain: medallion-architecture
file_type: architecture-config
last_validated: "2026-10-17"
source: "Databricks Medallion Architecture, Delta Lake documentation"
sources:
  - "https://docs.databricks.com/aws/en/lakehouse/medallion"
  - "https://docs.databricks.com/aws/en/tables/clustering"
  - "https://docs.databricks.com/aws/en/optimizations/predictive-optimization"
  - "https://docs.databricks.com/aws/en/tables/features/column-mapping"
  - "https://docs.databricks.com/aws/en/tables/features/change-data-feed"
  - "https://docs.databricks.com/aws/en/ingestion/file-metadata-column"
  - "https://docs.databricks.com/aws/en/tables/update-schema"
# Retention values below are example defaults, not platform requirements.

# ── Architecture Configuration ────────────────────────────────

architecture:
  name: "Medallion Architecture"
  description: "Multi-hop data architecture with Bronze, Silver, and Gold layers"
  layers:
    - name: bronze
      purpose: "Raw ingestion, append-only, schema-on-read"
      write_mode: append
      schema_enforcement: false
      merge_schema: true
      deduplication: false
      retention_days: 730   # 2 years
    - name: silver
      purpose: "Cleansed, deduplicated, conformed data"
      write_mode: merge
      schema_enforcement: true
      merge_schema: false
      deduplication: true
      retention_days: 365
    - name: gold
      purpose: "Dimensional modeling and aggregation per business domain"
      write_mode: merge            # merge | replace_where | overwrite (plain, schema kept) | materialized_view
      schema_enforcement: true
      merge_schema: false
      deduplication: false
      retention_days: 180

# ── Naming Conventions ────────────────────────────────────────

naming:
  database:
    pattern: "{layer}_{domain}"
    examples:
      - "bronze_sales"
      - "silver_sales"
      - "gold_sales"
  tables:
    bronze:
      pattern: "raw_{source}_{entity}"
      examples:
        - "raw_api_orders"
        - "raw_sftp_payments"
    silver:
      pattern: "cleansed_{entity}"
      examples:
        - "cleansed_orders"
        - "cleansed_payments"
    gold:
      dimensions: "dim_{entity}"
      facts: "fact_{entity}"
      aggregates: "agg_{metric}"
      examples:
        - "dim_customers"
        - "fact_orders"
        - "agg_daily_revenue"

# ── Metadata Columns ─────────────────────────────────────────

metadata_columns:
  bronze:
    required:
      - name: "_ingested_at"
        type: "TIMESTAMP"
        description: "When the record was ingested"
      - name: "_source_file"
        type: "STRING"
        description: "Source file path from _metadata.file_path (never input_file_name())"
      - name: "_source_system"
        type: "STRING"
        description: "Source system identifier"
  silver:
    required:
      - name: "_created_at"
        type: "TIMESTAMP"
        description: "When record first appeared in Silver"
      - name: "_updated_at"
        type: "TIMESTAMP"
        description: "Last update timestamp"
    optional:
      - name: "is_current"
        type: "BOOLEAN"
        description: "SCD Type 2 current flag"
      - name: "valid_from"
        type: "TIMESTAMP"
        description: "SCD Type 2 valid from"
      - name: "valid_to"
        type: "TIMESTAMP"
        description: "SCD Type 2 valid to (NULL = current; AUTO CDC uses __START_AT/__END_AT)"
  gold:
    required:
      - name: "_computed_at"
        type: "TIMESTAMP"
        description: "When aggregation was computed"

# ── Quality Gates ─────────────────────────────────────────────

quality:
  default_threshold: 0.99
  quarantine_enabled: true
  quarantine_database: "quarantine"
  checks:
    - name: "not_null"
      description: "Column value is not null"
      severity: "critical"
    - name: "positive"
      description: "Numeric column is greater than zero"
      severity: "warning"
    - name: "unique"
      description: "Column values are unique within partition"
      severity: "critical"
    - name: "referential"
      description: "Foreign key exists in referenced table"
      severity: "warning"
    - name: "range"
      description: "Value falls within expected range"
      severity: "warning"
    - name: "regex"
      description: "Value matches expected pattern"
      severity: "info"

# ── Delta Lake Settings ───────────────────────────────────────

delta:
  layout:
    strategy: liquid_clustering      # Databricks recommends it for all new tables
    cluster_by_auto: true            # UC managed tables + predictive optimization (DBR 15.4 LTS+)
    cluster_by:                      # used when cluster_by_auto is false (external tables)
      bronze: ["_ingested_at"]
      silver: ["business_key"]
      gold: ["common_filter_columns"]
    partition_by: []                 # only for tables >= 100 TB after measuring
    z_order: []                      # legacy; predictive optimization never runs ZORDER
  maintenance:
    predictive_optimization: true    # runs OPTIMIZE, VACUUM, ANALYZE on UC managed tables
    manual_schedule_when_external: "daily"
  retention:
    deleted_file_retention_duration: "7 days"   # VACUUM window; 7-day floor under predictive optimization
    log_retention_duration: "30 days"
  change_data_feed:
    mode: legacy                     # legacy (delta.enableChangeDataFeed) | automatic (DBR 19+, row tracking)
    silver: true                     # set at CREATE TABLE time
    gold: false

# ── Schema Evolution ─────────────────────────────────────────

schema_evolution:
  bronze:
    auto_merge: true                 # mergeSchema writer option / Auto Loader addNewColumns
    column_mapping: false
  silver:
    auto_merge: false                # explicit ALTER TABLE ADD COLUMN, type widening
    column_mapping: true
    column_mapping_mode: "id"        # "id" for new tables (recommended); "name" for existing tables
    min_reader_version: 2
    min_writer_version: 5
  gold:
    auto_merge: false
    overwrite_schema: false          # never: replaces schema/partitioning under consumers
    change_method: ddl               # ALTER TABLE ... ADD COLUMN, then ALTER COLUMN ... SET DEFAULT
